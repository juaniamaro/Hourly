<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hourly · Login</title>
  
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <canvas id="bg"></canvas>

    <main class="container">

        <section class="left">

            <!-- LOGO HOURLY -->
            <svg class="logo" viewBox="0 0 340 100" aria-label="Hourly">

                <text x="0" y="80" font-size="80" fill="#ffffff">
                    H
                </text>

                <!-- O como reloj -->
                <g id="clockO" transform="translate(90,55)">

                    <circle
                        cx="0"
                        cy="0"
                        r="22"
                        stroke="#ffffff"
                        stroke-width="4"
                        fill="none"
                    />

                    <line
                        id="secHand"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="-16"
                        stroke="#ffffff"
                        stroke-width="3"
                        stroke-linecap="round"
                    />

                </g>

                <text x="120" y="80" font-size="80" fill="#ffffff">
                    URLY
                </text>

            </svg>


            <!-- RELOJ -->
            <div
                class="clock"
                id="clock">
            </div>

            <!-- UBICACIÓN + TIEMPO -->
            <div
                class="weather"
                id="weather">

                📍 Detectando ubicación...

            </div>

        </section>

        <section class="right">

            <div class="login-container">

                <form id="loginForm">

                    <input
                        type="email"
                        id="email"
                        placeholder="Correo electrónico"
                        autocomplete="email"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="submit"
                        id="loginButton">

                        Iniciar sesión

                    </button>

                </form>

                <!-- Mensaje de error -->
                <div
                    id="loginMessage"
                    class="login-message">
                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
